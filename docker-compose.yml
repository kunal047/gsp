services:
  db:
    image: postgis/postgis:16-3.4
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: netra
      POSTGRES_PASSWORD: netra
      POSTGRES_DB: netra
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netra"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-300}
      REDIS_URL: redis://redis:6379/0
      LIVE_BASE: ${LIVE_BASE:-https://live.corp8.cloud}
      RTSP_SOURCES_JSON: ${RTSP_SOURCES_JSON:-[]}
      ATTRIBUTE_MIN_CLASS_CONFIDENCE: ${ATTRIBUTE_MIN_CLASS_CONFIDENCE:-0.75}
      HEAVY_VEHICLE_CLASS_CONFIDENCE: ${HEAVY_VEHICLE_CLASS_CONFIDENCE:-0.85}
      NETRA_JWT_SECRET: ${NETRA_JWT_SECRET:?Set NETRA_JWT_SECRET in .env}
    volumes:
      - snapshots:/snapshots
      - ./backend/app:/app/app
    ports:
      - "8000:8000"

  gateway:
    build: ./gateway
    volumes:
      - ./gateway/app.py:/app/app.py:ro
    environment:
      LIVE_BASE: ${LIVE_BASE:-https://live.corp8.cloud}
      BACKEND_URL: http://backend:8000
      BACKEND_TOKEN: ${BACKEND_SERVICE_TOKEN:?Set BACKEND_SERVICE_TOKEN in .env}
    depends_on:
      - backend
    ports:
      - "8081:8081"

  analytics:
    build: ./analytics
    volumes:
      - ./analytics/worker.py:/app/worker.py:ro
      - ./analytics/anpr.py:/app/anpr.py:ro
      - ./analytics/tracking.py:/app/tracking.py:ro
    environment:
      BACKEND_URL: http://backend:8000
      MAX_STREAMS: "6"
      SAMPLE_EVERY: "2.0"
      OCR_TOPK: "4"
      SEEK_SECONDS: ${SEEK_SECONDS:-0}
      TRACK_MIN_HITS: ${TRACK_MIN_HITS:-3}
      TRACK_MAX_MISSES: ${TRACK_MAX_MISSES:-3}
      TRACK_MIN_CONFIDENCE: ${TRACK_MIN_CONFIDENCE:-0.45}
      VEHICLE_MODEL: ${VEHICLE_MODEL:-yolov8n.pt}
      VEHICLE_CLASS_MAP_JSON: ${VEHICLE_CLASS_MAP_JSON:-}
      CAMERA_EXPECTED_DIRECTIONS_JSON: ${CAMERA_EXPECTED_DIRECTIONS_JSON:-}
      BACKEND_TOKEN: ${BACKEND_SERVICE_TOKEN:?Set BACKEND_SERVICE_TOKEN in .env}
    depends_on:
      - backend

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./data/clips:/clips:ro
    expose:
      - "8554"
    ports:
      - "8554:8554"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
      VITE_GATEWAY_BASE: http://localhost:8081
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - gateway

volumes:
  pgdata:
  snapshots:
